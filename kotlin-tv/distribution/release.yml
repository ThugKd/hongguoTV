name: Build and publish TV update
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tv-stable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set release version and restore signing key
        env:
          # Accept existing signing secrets without changing the signing key.
          KEYSTORE_B64: ${{ secrets.LVGUOTV_KEYSTORE_B64 || secrets.HONGGUOTV_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "LVGUOTV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "LVGUOTV_VERSION_CODE=19" >> "$GITHUB_ENV"
          echo "LVGUOTV_VERSION_NAME=1.0.1" >> "$GITHUB_ENV"
          echo "UPDATE_TAG=v1.0.1" >> "$GITHUB_ENV"
          {
            echo "RELEASE_NOTES<<RELEASE_NOTES_END"
            echo "- 画面增强默认开启，可手动关闭；使用保色的自适应亮度锐化，保持画面原有亮度与色彩"
            echo "- 内置、片源与快传视频统一增强处理；HDR 保持原画，GPU 特效失败自动回退"
            echo "- 网络取流失败时优先尝试同清晰度备用地址，减少不必要的画质下降"
            echo "- 临时降档后重新选择 1080P 立即重新取流，保留进度和播放/暂停状态"
            echo "- 网络降档后稳定播放 30 秒，下一集可尝试恢复清晰度；每次观看会话最多一次，解码降档不自动升档"
            echo "- 清晰度弹窗打开后正确聚焦当前选择，遥控器可直接确认"
            echo "RELEASE_NOTES_END"
          } >> "$GITHUB_ENV"
      - name: Tests, release lint, and signed APK
        env:
          LVGUOTV_STORE_PASSWORD: ${{ secrets.LVGUOTV_STORE_PASSWORD || secrets.HONGGUOTV_STORE_PASSWORD }}
          LVGUOTV_KEY_ALIAS: ${{ secrets.LVGUOTV_KEY_ALIAS || secrets.HONGGUOTV_KEY_ALIAS }}
          LVGUOTV_KEY_PASSWORD: ${{ secrets.LVGUOTV_KEY_PASSWORD || secrets.HONGGUOTV_KEY_PASSWORD }}
        run: ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:lintRelease :app:assembleRelease --console=plain
      - name: Publish APK, source, and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-tv-update.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tv-update-verification
          path: |
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/lint-results-release.*
            outputs/update.json
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
